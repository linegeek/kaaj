[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaaj"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.12",
    "httpx==0.28.1",
    "anthropic==0.40.0",
    "pdfplumber==0.11.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
hatchet = [
    "hatchet-sdk>=0.47.1",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
